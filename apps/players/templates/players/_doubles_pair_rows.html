{% load i18n %}
{% for pair in pairs %}
<tr id="pair-row-{{ pair.pk }}">
    <td>{{ pair.player_one.full_name }}</td>
    <td>{{ pair.player_two.full_name }}</td>
    {% if can_manage %}
    <td class="text-right">
        <button type="button"
                class="btn btn-xs btn-error btn-outline"
                hx-delete="{% url 'players:pair_delete' pair.pk %}"
                hx-target="#pair-row-{{ pair.pk }}"
                hx-swap="outerHTML"
                hx-confirm="{% translate 'Are you sure you want to delete this pair?' %}">
            {% translate "Delete" %}
        </button>
    </td>
    {% endif %}
</tr>
{% empty %}
<tr>
    <td colspan="3" class="text-center text-base-content/60 py-8">{% translate "No doubles pairs found." %}</td>
</tr>
{% endfor %}
