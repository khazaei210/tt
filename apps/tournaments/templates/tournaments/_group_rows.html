{% load i18n ui_kit %}
{% for group in groups %}
<tr id="group-row-{{ group.pk }}">
    <td><a href="{% url 'tournaments:group_detail' group.pk %}" class="link link-primary">{{ group.name }}</a></td>
    <td class="hidden sm:table-cell">{{ group.order }}</td>
    {% if can_manage %}
    <td class="text-right">
        {% if not group.stage.is_locked %}
        <button type="button"
                class="btn btn-xs btn-error btn-outline"
                aria-label="{% translate 'Delete' %}"
                hx-delete="{% url 'tournaments:group_delete' group.pk %}"
                hx-target="#group-row-{{ group.pk }}"
                hx-swap="outerHTML"
                hx-confirm="{% translate 'Are you sure you want to delete this group?' %}">
            {% icon "delete" %}<span class="hidden sm:inline">{% translate "Delete" %}</span>
        </button>
        {% endif %}
    </td>
    {% endif %}
</tr>
{% empty %}
<tr>
    <td colspan="3" class="text-center text-base-content/60 py-8">{% translate "No groups yet." %}</td>
</tr>
{% endfor %}
